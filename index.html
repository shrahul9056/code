<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main style="font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px;">
        <header style="margin-bottom: 24px;">
            <h1 style="margin: 0 0 8px; font-size: 32px;">Sample Page</h1>
            <p style="margin: 0; color: #555;">This is a simple HTML sample with basic content.</p>
        </header>

        <section style="margin-bottom: 24px;">
            <h2 style="margin: 0 0 8px; font-size: 20px;">Highlights</h2>
            <ul style="margin: 0; padding-left: 18px; color: #333;">
                <li>Clean layout with inline styles</li>
                <li>Header, section, and footer structure</li>
                <li>Ready for further customization</li>
            </ul>
        </section>

        <section style="margin-bottom: 24px;">
            <h2 style="margin: 0 0 8px; font-size: 20px;">Call to Action</h2>
            <p style="margin: 0 0 12px; color: #333;">You can replace this content with your own page content.</p>
            <button style="padding: 10px 16px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer;">
                Get Started
            </button>
        </section>

        <footer style="border-top: 1px solid #e5e7eb; padding-top: 12px; color: #6b7280;">
            <small>© 2026 Sample Company</small>
        </footer>
    </main>
</body>
</html>
